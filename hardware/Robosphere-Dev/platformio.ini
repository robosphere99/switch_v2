; ============================================================
; PlatformIO Project Configuration
; https://docs.platformio.org/page/projectconf.html
;
; MULTI-DEVICE SETUP:
;   [env]  = common settings — SAB devices pe apply hoti hain
;   Har device ke 2 env hote hain:
;     <device>-serial  -> USB cable se upload (COM port)
;     <device>-ota     -> WiFi se upload (device ka IP)
;
; Nayi device add karni ho toh bas neeche ek block copy karke
; COM port + IP badal do — baaki sab [env] se inherit hota hai.
; ============================================================

; ------------------------------------------------------------
; COMMON — sab devices ke liye
; ------------------------------------------------------------
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Serial monitor baud rate (Logger::begin default 115200)
monitor_speed = 115200

; Upload baud rate kam rakha hai (921600 flaky connections pe fail hota hai)
upload_speed = 115200

; OTA partition scheme — app0 + app1 (1.25MB each) + otadata => safe OTA
; Update INACTIVE slot pe flash hota hai, fail pe purana slot boot hota hai
board_build.partitions = partitions_ota.csv

; Loop task stack 8KB -> 16KB. Web request handler ke andar blocking HTTPS
; (TLS handshake + JSON parse) 8KB stack overflow karta tha — device crash +
; reboot ho jaati thi ("Stack canary watchpoint triggered (loopTask)")
board_build.arduino.loop_stack_size = 16384

; ArduinoJson v6 required - code uses StaticJsonDocument (v7 removed it)
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8

; ============================================================
; DEVICE 1 — ghar ka main device
;   Serial: COM8  |  OTA: 192.168.1.34
; ============================================================
[env:esp32doit-devkit-v1]
upload_port = COM8
monitor_port = COM8

[env:esp32-ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
; DEVICE 1 ka IP — DHCP se badal sakta hai! Check: dashboard ya serial boot log
upload_port = 192.168.1.37


upload_flags =
    -a
    admin

; ============================================================
; DEVICE 2 — doosri ESP32 (COM5)
;   Serial: COM5  |  OTA: 192.168.1.36 (boot log se mila)
; ============================================================
[env:esp32doit-devkit2]
upload_port = COM5
monitor_port = COM5

[env:esp32doit-devkit2-ota]
extends = env:esp32doit-devkit2
upload_protocol = espota
upload_port = 192.168.1.36
upload_flags =
    -a
    admin

; ============================================================
; PER-MODEL BUILDS — factory me har model ka apna .bin banta hai
;   pio run -e model-2ch  -> .pio/build/model-2ch/firmware.bin
;   pio run -e model-4ch  -> default (same as esp32doit-devkit-v1)
;   pio run -e model-8ch
;   pio run -e model-dim3 (DIM-3S: off->50->100)
;   pio run -e model-dim4 (DIM-4S: off->33->66->100)
; OTA publish karte waqt sahi model ka .bin upload karna.
; ============================================================
[env:model-2ch]
extends = env:esp32doit-devkit-v1
build_flags = -DMODEL_2CH -DMODEL_CODE=\"2CH\"

[env:model-4ch]
extends = env:esp32doit-devkit-v1
build_flags = -DMODEL_4CH -DMODEL_CODE=\"4CH\"

[env:model-8ch]
extends = env:esp32doit-devkit-v1
build_flags = -DMODEL_8CH -DMODEL_CODE=\"8CH\"

[env:model-dim3]
extends = env:esp32doit-devkit-v1
build_flags = -DMODEL_DIM3 -DMODEL_CODE=\"DIM-3S\" -DMODEL_DIMMER_STEPS=3

[env:model-dim4]
extends = env:esp32doit-devkit-v1
build_flags = -DMODEL_DIM4 -DMODEL_CODE=\"DIM-4S\" -DMODEL_DIMMER_STEPS=4
